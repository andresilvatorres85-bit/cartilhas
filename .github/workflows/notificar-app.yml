name: Notificar app (Banco de Projetos)

# Ao publicar/alterar/remover cartilhas, dispara o Build e Deploy do
# repositório banco-projetos-emendas (evento repository_dispatch
# "cartilhas-atualizadas", já escutado pelo workflow do app).
on:
  push:
    branches: [main]
    paths: ["**.pdf"]
  workflow_dispatch:

# Atualizações costumam vir em vários commits seguidos (apagar a versão
# antiga, enviar a nova...). Cada push cancela a espera anterior, então só
# um disparo sai depois que os envios param.
concurrency:
  group: notificar-app
  cancel-in-progress: true

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar fim da sequência de envios (3 min)
        run: sleep 180

      - name: Disparar Build e Deploy do app
        env:
          TOKEN: ${{ secrets.APP_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Segredo APP_DISPATCH_TOKEN não configurado (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/andresilvatorres85-bit/banco-projetos-emendas/dispatches \
            -d '{"event_type":"cartilhas-atualizadas"}'
          echo "Build e Deploy do app disparado."
